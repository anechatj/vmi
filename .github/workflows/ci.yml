name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose -f infra/docker/docker-compose.local.yml config
        env:
          POSTGRES_DB: vmi
          POSTGRES_USER: vmi_user
          POSTGRES_PASSWORD: ci_placeholder
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: ci_placeholder
          MINIO_BUCKET_NAME: vmi-attachments
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: ci_placeholder
          KEYCLOAK_PORT: 8080

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # TODO: เพิ่ม job build/test สำหรับ apps/policy-api เมื่อ scaffold เสร็จ (mvn verify)
