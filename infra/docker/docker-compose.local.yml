services:
  postgres:
    image: postgres:18-alpine
    container_name: vmi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vmi-network

  minio:
    image: minio/minio:latest
    container_name: vmi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vmi-network

  # สร้าง bucket ให้อัตโนมัติตอน `make up` — ดู ADR-0004 และ infra/minio/init-buckets.sh
  minio-init:
    image: minio/mc:latest
    container_name: vmi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    volumes:
      - ../minio/init-buckets.sh:/init/init-buckets.sh:ro
    networks:
      - vmi-network

  # Web UI สำหรับ browse ข้อมูลใน PostgreSQL (postgres เองไม่มี web UI ในตัว)
  adminer:
    image: adminer:latest
    container_name: vmi-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vmi-network

  redis:
    image: redis:7-alpine
    container_name: vmi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vmi-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: vmi-keycloak
    restart: unless-stopped
    # import realm config อัตโนมัติจาก infra/keycloak/vmi-realm.json ทุกครั้งที่ container start
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import
      - ../keycloak/themes/vmi:/opt/keycloak/themes/vmi
    networks:
      - vmi-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  vmi-network:
    driver: bridge
