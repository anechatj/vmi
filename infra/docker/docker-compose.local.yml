services:
  postgres:
    image: postgres:16-alpine
    container_name: vmi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vmi-network

  minio:
    image: minio/minio:latest
    container_name: vmi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vmi-network

  # สร้าง bucket ให้อัตโนมัติตอน `make up` — ดู ADR-0004 และ infra/minio/init-buckets.sh
  minio-init:
    image: minio/mc:latest
    container_name: vmi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    volumes:
      - ../minio/init-buckets.sh:/init/init-buckets.sh:ro
    networks:
      - vmi-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: vmi-keycloak
    restart: unless-stopped
    # เพิ่ม --import-realm หลังวาง realm export ไว้ที่ infra/keycloak/ (ดู README ในโฟลเดอร์นั้น)
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import
    networks:
      - vmi-network

volumes:
  postgres_data:
  minio_data:

networks:
  vmi-network:
    driver: bridge
